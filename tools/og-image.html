<!doctype html>
<!-- Social preview source. Render at 1200x630 and save the screenshot as og-image.png. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      position: relative;
      background-color: var(--color-bg);
      background-image:
        linear-gradient(var(--color-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--color-ink);
      font-family: var(--font-sans);
    }
    .art {
      position: absolute;
      left: 170px;
      top: 300px;
      width: 1240px;
      aspect-ratio: 2040 / 630;
    }
    .art img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .glow, .flame { mix-blend-mode: screen; }
    .glow { opacity: 0.45; }
    .text {
      position: absolute;
      left: 72px;
      top: 64px;
    }
    .eyebrow {
      margin: 0 0 18px;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink-muted);
    }
    .eyebrow b { color: var(--color-accent); font-weight: 500; }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 100px;
      font-style: italic;
      font-weight: 900;
      font-stretch: 150%;
      letter-spacing: -0.01em;
      line-height: 0.9;
      text-transform: uppercase;
    }
    p {
      margin: 20px 0 0;
      font-size: 30px;
      font-weight: 560;
      color: var(--color-ink-muted);
    }
  </style>
</head>
<body>
  <div class="art">
    <img src="../assets/img/hero/mach-field.webp" alt="">
    <img class="glow" src="../assets/img/hero/bloom.webp" alt="">
    <img class="flame" src="../assets/img/hero/flame.webp" alt="">
    <img src="../assets/img/hero/engine.webp" alt="">
  </div>
  <div class="text">
    <p class="eyebrow"><b>Mechanical engineering</b> · Stevens Institute of Technology</p>
    <h1>Charles Thorn</h1>
    <p>I design, build, and integrate hardware.</p>
  </div>
</body>
</html>
