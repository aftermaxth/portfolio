  <!-- Content stays visible if the script never runs: the hidden state only applies once .js is set,
       and the failsafe class lifts it after 4 s unless the motion module cancels it. -->
  <script>
    document.documentElement.classList.add("js");
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.add("reveal-failsafe"); }, 4000);
